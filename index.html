/* ---- 純 JS 加密套件：SHA-256 / HMAC / PBKDF2 / AES-256-CTR（http 靜態託管可用）---- */
function sha256(ascii){
  function rr(v,a){return(v>>>a)|(v<<(32-a));}
  var mp=Math.pow,mw=mp(2,32),result='',words=[],bitLen=ascii.length*8;
  var hash=sha256.h=sha256.h||[],k=sha256.k=sha256.k||[],pc=k.length;
  var isC={};
  for(var cand=2;pc<64;cand++){
    if(!isC[cand]){
      for(var z=0;z<313;z+=cand)isC[z]=cand;
      hash[pc]=(mp(cand,.5)*mw)|0;
      k[pc++]=(mp(cand,1/3)*mw)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56)ascii+='\x00';
  for(var p=0;p<ascii.length;p++){
    var cj=ascii.charCodeAt(p);
    if(cj>>8)return'';
    words[p>>2]|=cj<<((3-p)%4)*8;
  }
  words[words.length]=(bitLen/mw)|0;
  words[words.length]=bitLen;
  for(var c0=0;c0<words.length;){
    var w=words.slice(c0,c0+=16),oldHash=hash;
    hash=hash.slice(0,8);
    for(var r=0;r<64;r++){
      var w15=w[r-15],w2=w[r-2];
      var a=hash[0],e=hash[4];
      var t1=hash[7]+(rr(e,6)^rr(e,11)^rr(e,25))+((e&hash[5])^((~e)&hash[6]))+k[r]
        +(w[r]=(r<16)?w[r]:(w[r-16]+(rr(w15,7)^rr(w15,18)^(w15>>>3))+w[r-7]+(rr(w2,17)^rr(w2,19)^(w2>>>10)))|0);
      var t2=(rr(a,2)^rr(a,13)^rr(a,22))+((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(t1+t2)|0].concat(hash);
      hash[4]=(hash[4]+t1)|0;
    }
    for(var f=0;f<8;f++){
      hash[f]=(oldHash[f]+hash[f])|0;
    }
  }
  for(var o=0;o<8;o++){
    for(var q=3;q+1;q--){
      var b=(hash[o]>>(q*8))&255;
      result+=((b<16)?0:'')+b.toString(16);
    }
  }
  return result;
}
function hx(s){var o='';for(var i=0;i<s.length;i+=2)o+=String.fromCharCode(parseInt(s.substr(i,2),16));return o;}
function b2h(s){var o='';for(var i=0;i<s.length;i++){var b=s.charCodeAt(i)&255;o+=(b<16?'0':'')+b.toString(16);}return o;}
function hmac(key,msg){
  if(key.length>64)key=b2h(sha256(key));
  var o='',i2='';
  for(var i=0;i<64;i++){
    var kc=i<key.length?key.charCodeAt(i):0;
    o+=String.fromCharCode(kc^0x5c);
    i2+=String.fromCharCode(kc^0x36);
  }
  return sha256(o+hx(sha256(i2+msg)));
}
function pbkdf2(pw,salt,iter,dkLen){
  var dk='',block=1;
  while(dk.length<dkLen*2){
    var u=hmac(pw,salt+String.fromCharCode((block>>>24)&255,(block>>>16)&255,(block>>>8)&255,block&255));
    var tHex=u;
    for(var n=1;n<iter;n++){
      u=hmac(pw,hx(u));
      var x='';
      for(var i=0;i<tHex.length;i+=2){
        var a=parseInt(tHex.substr(i,2),16)^parseInt(u.substr(i,2),16);
        x+=(a<16?'0':'')+a.toString(16);
      }
      tHex=x;
    }
    dk+=tHex;block++;
  }
  return hx(dk.substring(0,dkLen*2));
}
function hexToBytes(h){var u=new Uint8Array(h.length/2);for(var i=0;i<u.length;i++)u[i]=parseInt(h.substr(i*2,2),16);return u;}
function pbkdf2Web(pw,saltHex,iter,dkLen){

    return pbkdf2Web(pw,saltHex,iter,dkLen);
  }
  return new Promise(function(res){setTimeout(function(){res(pbkdf2(pw,hx(saltHex),iter,dkLen));},60);});
}
function __decryptWithKey(key){
  var data=atob(C.d);
  var plain=ctrXor(data,key,hx(C.i));
  if(sha256(plain)!==C.h)throw new Error('bad password or corrupted');
  return utf8Decode(plain);
}
var SB=C.sb;
function xtime(a){return((a<<1)^((a&0x80)?0x1b:0))&255;}
function expandKey(key){
  var w=[],i;
  for(i=0;i<8;i++)w[i]=[key[4*i],key[4*i+1],key[4*i+2],key[4*i+3]];
  var rc=[0x01,0x02,0x04,0x08,0x10,0x20,0x40];
  for(i=8;i<60;i++){
    var t=w[i-1];
    var tmp=(i%8===0)?[SB[t[1]]^rc[i/8-1],SB[t[2]],SB[t[3]],SB[t[0]]]:(i%8===4?[SB[t[0]],SB[t[1]],SB[t[2]],SB[t[3]]]:t.slice());
    w[i]=[w[i-8][0]^tmp[0],w[i-8][1]^tmp[1],w[i-8][2]^tmp[2],w[i-8][3]^tmp[3]];
  }
  return w;
}
function encryptBlock(w,block){
  var s=new Array(16),i,r,c;
  for(i=0;i<16;i++)s[i]=block[i]^w[i>>2][i&3];
  for(r=1;r<14;r++){
    var t=new Array(16);
    for(i=0;i<16;i++)t[i]=SB[s[(i+(4*(i%4)))%16]];
    for(c=0;c<4;c++){
      var a=[t[4*c],t[4*c+1],t[4*c+2],t[4*c+3]];
      var h=a[0]^a[1]^a[2]^a[3];
      s[4*c]=a[0]^h^xtime(a[0]^a[1]);
      s[4*c+1]=a[1]^h^xtime(a[1]^a[2]);
      s[4*c+2]=a[2]^h^xtime(a[2]^a[3]);
      s[4*c+3]=a[3]^h^xtime(a[3]^a[0]);
    }
    for(i=0;i<16;i++)s[i]^=w[4*r+(i>>2)][i&3];
  }
  var t2=new Array(16);
  for(i=0;i<16;i++)t2[i]=SB[s[(i+(4*(i%4)))%16]];
  for(i=0;i<16;i++)s[i]=t2[i]^w[56+(i>>2)][i&3];
  return s;
}
function ctrXor(data,key,iv){
  var w=expandKey(key.split('').map(function(c){return c.charCodeAt(0);}));
  var ctr=iv.split('').map(function(c){return c.charCodeAt(0);});
  var out='';
  for(var off=0;off<data.length;off+=16){
    var ks=encryptBlock(w,ctr);
    var n=Math.min(16,data.length-off);
    for(var i=0;i<n;i++)out+=String.fromCharCode(data.charCodeAt(off+i)^ks[i]);
    for(i=15;i>=0;i--){ctr[i]=(ctr[i]+1)&255;if(ctr[i])break;}
  }
  return out;
}
function utf8Decode(bytes){
  var out='',i=0,c;
  while(i<bytes.length){
    c=bytes.charCodeAt(i);
    if(c<0x80){out+=String.fromCharCode(c);i++;}
    else if(c<0xE0){out+=String.fromCharCode(((c&0x1F)<<6)|(bytes.charCodeAt(i+1)&0x3F));i+=2;}
    else if(c<0xF0){out+=String.fromCharCode(((c&0x0F)<<12)|((bytes.charCodeAt(i+1)&0x3F)<<6)|(bytes.charCodeAt(i+2)&0x3F));i+=3;}
    else{var cp=((c&0x07)<<18)|((bytes.charCodeAt(i+1)&0x3F)<<12)|((bytes.charCodeAt(i+2)&0x3F)<<6)|(bytes.charCodeAt(i+3)&0x3F);cp-=0x10000;out+=String.fromCharCode(0xD800+(cp>>10),0xDC00+(cp&0x3FF));i+=4;}
  }
  return out;
}
function __decrypt(passphrase){
  var key=pbkdf2(passphrase,hx(C.s),C.n,32);
  var data=atob(C.d);
  var plain=ctrXor(data,key,hx(C.i));
  if(sha256(plain)!==C.h)throw new Error('bad password or corrupted');
  return utf8Decode(plain);
}
/* ---- 頁面流程：有密碼 → 解密；錯 3 次 → 鎖 5 分鐘 ---- */
if(typeof document!=='undefined'){
  (function(){
    function $(id){return document.getElementById(id);}
    var ld=$('ld'),card=$('gateCard'),b1=$('b1'),b2=$('b2'),b3=$('b3'),err=$('gateErr'),lockMsg=$('lockMsg');
    var MAX=3,LOCK_MS=5*60*1000;
    function ls(k){try{return localStorage.getItem(k)}catch(e){return null}}
    function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
    function fails(){return Number(ls('gate-fails')||0);}
    function lockLeft(){return Math.max(0,Number(ls('gate-lock')||0)-Date.now());}
    var lockTimer=null;
    function inputsOff(off){b1.readOnly=off;b2.readOnly=off;b3.readOnly=off;card.style.opacity=off?'0.55':'1';}
    function tickLock(){
      var left=lockLeft();
      if(left<=0){
        lockMsg.style.display='none';inputsOff(false);
        if(lockTimer){clearInterval(lockTimer);lockTimer=null;}
        var stored='';try{stored=localStorage.getItem('gate-pw')||''}catch(e){}
        if(stored){tryPass(stored);}else{b1.focus();}
        return;
      }
      var m=Math.floor(left/60000),s=Math.floor((left%60000)/1000);
      lockMsg.textContent='⏳ 錯太多次 — 請 '+m+' 分 '+String(s).padStart(2,'0')+' 秒後再試';
      lockTimer=setTimeout(tickLock,500);
    }
    function showLocked(){
      err.style.display='none';
      ld.classList.add('hidden');card.classList.remove('hidden');
      inputsOff(true);b1.value='';b2.value='';b3.value='';
      b1.classList.remove('filled');b2.classList.remove('filled');b3.classList.remove('filled');
      lockMsg.style.display='block';tickLock();
    }
    function showGate(){ld.classList.add('hidden');card.classList.remove('hidden');setTimeout(function(){b1.focus();},100);}
    var webCrypto=(typeof window!=='undefined')&&!!(window.crypto&&window.crypto.subtle&&window.crypto.subtle.deriveBits);
    function tryPass(pass){
      if(lockLeft()>0){showLocked();return;}
      card.classList.add('hidden');ld.classList.remove('hidden');
      if(!webCrypto){var m=ld.querySelector('.msg');if(m)m.textContent='解密中…（純 JS 較慢模式，請稍候约 30 秒）';}
      pbkdf2Any(pass,C.s,C.n,32).then(function(key){
        var plain=__decryptWithKey(key);
        lsSet('gate-fails','0');
        try{localStorage.setItem('gate-pw',pass);}catch(e){}
        document.open();document.write(plain);document.close();
      }).catch(function(){
        var n=fails()+1;
        if(n>=MAX){
          lsSet('gate-fails','0');lsSet('gate-lock',String(Date.now()+LOCK_MS));
          showLocked();
        }else{
          lsSet('gate-fails',String(n));
          ld.classList.add('hidden');card.classList.remove('hidden');
          err.textContent='錯喇（第 '+n+'/'+MAX+' 次）再諗諗 💡';err.style.display='block';
          b1.value='';b2.value='';b3.value='';
          b1.classList.remove('filled');b2.classList.remove('filled');b3.classList.remove('filled');b1.focus();
        }
      });
    }
    var stored='';
    try{stored=localStorage.getItem('gate-pw')||sessionStorage.getItem('gate-pw')||'';}catch(e){}
    if(lockLeft()>0){showLocked();}
    else if(stored){tryPass(stored);}
    else{showGate();}
    function norm(el){el.value=el.value.toUpperCase().replace(/[^A-Z0-9]/g,'');}
    function filledState(){b1.classList.toggle('filled',!!b1.value);b2.classList.toggle('filled',!!b2.value);b3.classList.toggle('filled',!!b3.value);}
    function maybeSubmit(){
      if(b1.value&&b2.value&&b3.value){tryPass(b1.value+b2.value+b3.value);}
    }
    b1.addEventListener('input',function(){if(lockLeft()>0)return;norm(b1);filledState();if(b1.value)b2.focus();else maybeSubmit();});
    b2.addEventListener('input',function(){if(lockLeft()>0)return;norm(b2);filledState();if(b2.value)b3.focus();else b1.focus();});
    b3.addEventListener('input',function(){if(lockLeft()>0)return;norm(b3);filledState();if(b3.value){maybeSubmit();}else{b2.focus();}});
  })();
}
</script>
